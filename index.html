<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마음에 피어나는 우리말 꽃 - 서정 어린이 시 50편</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Pretendard 폰트 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .poem-line {
      line-height: 2.1;
      letter-spacing: -0.01em;
    }
    .fade-enter {
      animation: fadeIn 0.25s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen flex flex-col justify-between selection:bg-emerald-100 selection:text-emerald-900">

  <!-- ================= 1. 상단 공통 네비게이션 바 ================= -->
  <header class="bg-white/95 backdrop-blur-md border-b border-stone-200 sticky top-0 z-40 shadow-xs">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <!-- 로고 및 홈 버튼 -->
      <button onclick="navigate('home')" class="flex items-center gap-2.5 text-left group">
        <span class="text-2xl p-1.5 bg-emerald-100 text-emerald-800 rounded-xl group-hover:bg-emerald-200 transition">🌸</span>
        <div>
          <h1 class="text-base sm:text-lg font-extrabold text-stone-900 leading-tight">마음에 피어나는 우리말 꽃</h1>
          <p class="text-xs text-stone-500 hidden sm:block">순우리말 융합 초등 서정 동시 50편</p>
        </div>
      </button>

      <!-- 화면 이동 및 뷰 컨트롤 -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <button id="navBackBtn" onclick="goBack()" class="hidden text-xs sm:text-sm font-semibold px-3 py-1.5 rounded-lg bg-stone-100 hover:bg-stone-200 text-stone-700 transition flex items-center gap-1">
          <span>◀</span> <span>이전</span>
        </button>
        <button onclick="navigate('home')" class="text-xs sm:text-sm font-semibold px-3 py-1.5 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-800 transition flex items-center gap-1">
          <span>🏠</span> <span>첫 화면</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ================= 2. 메인 동적 화면 컨테이너 ================= -->
  <main class="max-w-4xl w-full mx-auto p-4 sm:p-6 flex-1">

    <!-- [화면 1: 첫 화면 (5개 묶음 상자)] -->
    <section id="view-home" class="fade-enter space-y-6">
      <!-- 머리말 소개 배너 -->
      <div class="bg-gradient-to-br from-emerald-700 to-teal-800 text-white rounded-3xl p-6 sm:p-8 shadow-sm relative overflow-hidden">
        <div class="relative z-10 space-y-2">
          <span class="inline-block bg-white/20 text-emerald-100 text-xs font-bold px-3 py-1 rounded-full">
            초등 전 학년 우리말 감성 서재
          </span>
          <h2 class="text-2xl sm:text-3xl font-black tracking-tight">
            우리말의 고운 결을 담은 50편의 동시
          </h2>
          <p class="text-emerald-100 text-xs sm:text-sm max-w-xl leading-relaxed pt-1">
            국립국어원 선정 아름다운 순우리말 100선이 맑은 동시로 태어났습니다. 읽고 싶은 동시 묶음을 선택해 보세요.
          </p>
        </div>
        <div class="absolute -right-8 -bottom-10 text-white/10 text-9xl select-none font-serif">詩</div>
      </div>

      <!-- 5개 묶음 글 상자 그리드 -->
      <div>
        <h3 class="text-sm font-bold text-stone-500 uppercase tracking-wider mb-3 px-1">
          동시 모음집 선택하기
        </h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="volumeCardsContainer">
          <!-- JS 동적 렌더링 -->
        </div>
      </div>
    </section>

    <!-- [화면 2: 목록 화면 (해당 묶음 10개 시의 제목 목록)] -->
    <section id="view-list" class="hidden fade-enter space-y-4">
      <!-- 볼륨 안내 바 -->
      <div class="bg-white rounded-2xl p-4 sm:p-5 border border-stone-200 shadow-xs flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <span id="listVolBadge" class="inline-block text-xs font-bold text-emerald-800 bg-emerald-100 px-2.5 py-0.5 rounded-md mb-1"></span>
          <h2 id="listVolTitle" class="text-lg sm:text-xl font-black text-stone-900"></h2>
          <p id="listVolSub" class="text-xs text-stone-500"></p>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="navigate('home')" class="text-xs font-semibold px-3 py-2 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-700 transition">
            🏠 첫 화면으로
          </button>
        </div>
      </div>

      <!-- 10편 제목 카드 리스트 -->
      <div id="poemListContainer" class="space-y-2.5">
        <!-- JS 동적 렌더링 -->
      </div>
    </section>

    <!-- [화면 3: 상세 화면 (선택한 시의 내용, 단어 풀이, 감상 길라잡이)] -->
    <section id="view-detail" class="hidden fade-enter space-y-4">
      <!-- 상단 컨트롤 (이전/홈/글자 크기) -->
      <div class="flex items-center justify-between flex-wrap gap-2 pb-1">
        <div class="flex items-center gap-2">
          <button onclick="goToListFromDetail()" class="text-xs sm:text-sm font-bold px-3 py-2 rounded-xl bg-white border border-stone-200 hover:bg-stone-100 text-stone-700 shadow-xs transition flex items-center gap-1">
            <span>◀</span> <span id="backToListLabel">목록으로</span>
          </button>
          <button onclick="navigate('home')" class="text-xs sm:text-sm font-bold px-3 py-2 rounded-xl bg-white border border-stone-200 hover:bg-stone-100 text-stone-700 shadow-xs transition">
            🏠 첫 화면
          </button>
        </div>

        <!-- 글자 크기 토글 (교실 전자칠판/스마트폰 가독성 배려) -->
        <div class="flex items-center gap-1 bg-white border border-stone-200 rounded-xl p-1 shadow-xs">
          <button onclick="setTextSize('normal')" id="btnFontNormal" class="text-xs font-bold px-2.5 py-1 rounded-lg bg-emerald-600 text-white transition">보통</button>
          <button onclick="setTextSize('large')" id="btnFontLarge" class="text-xs font-bold px-2.5 py-1 rounded-lg text-stone-600 hover:bg-stone-100 transition">크게</button>
        </div>
      </div>

      <!-- 시 본문 카드 -->
      <article class="bg-white rounded-3xl p-6 sm:p-10 border border-stone-200 shadow-xs space-y-8">
        <!-- 시 제목 헤더 -->
        <div class="border-b border-stone-100 pb-5 text-center">
          <span id="poemDetailNumber" class="text-xs sm:text-sm font-black text-emerald-700 tracking-wider"></span>
          <h2 id="poemDetailTitle" class="text-xl sm:text-2xl md:text-3xl font-extrabold text-stone-900 mt-1 mb-3"></h2>
          <!-- 융합 단어 태그들 -->
          <div id="poemWordBadges" class="flex flex-wrap justify-center gap-1.5 pt-1"></div>
        </div>

        <!-- 시 본문 텍스트 -->
        <div id="poemBodyText" class="poem-line text-stone-800 text-base sm:text-lg font-medium max-w-xl mx-auto space-y-5 text-center sm:text-left whitespace-pre-line">
        </div>

        <!-- 하단 정보 카드: 1) 융합 순우리말 풀이 -->
        <div class="bg-emerald-50/70 border border-emerald-100 rounded-2xl p-5 space-y-3">
          <h3 class="text-xs sm:text-sm font-black text-emerald-950 flex items-center gap-1.5">
            <span>🌿</span> 융합 순우리말 뜻풀이
          </h3>
          <ul id="poemVocabList" class="space-y-1.5 text-xs sm:text-sm text-stone-700"></ul>
        </div>

        <!-- 하단 정보 카드: 2) 감상 길라잡이 -->
        <div class="bg-stone-50 border border-stone-200 rounded-2xl p-5 space-y-2">
          <h3 class="text-xs sm:text-sm font-black text-stone-900 flex items-center gap-1.5">
            <span>💡</span> 감상 길라잡이
          </h3>
          <p id="poemGuideText" class="text-xs sm:text-sm text-stone-600 leading-relaxed"></p>
        </div>

        <!-- 하단 이전 시 / 다음 시 네비게이션 -->
        <div class="pt-4 border-t border-stone-100 flex items-center justify-between gap-2">
          <button id="btnPrevPoem" onclick="movePoem(-1)" class="text-xs sm:text-sm font-bold px-4 py-2.5 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-700 transition flex items-center gap-1">
            <span>◀</span> <span>이전 시</span>
          </button>
          <span id="poemPagerText" class="text-xs font-semibold text-stone-400"></span>
          <button id="btnNextPoem" onclick="movePoem(1)" class="text-xs sm:text-sm font-bold px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white transition flex items-center gap-1">
            <span>다음 시</span> <span>▶</span>
          </button>
        </div>
      </article>
    </section>

  </main>

  <!-- ================= 3. 푸터 ================= -->
  <footer class="bg-white border-t border-stone-200 py-4 text-center text-xs text-stone-500">
    국립국어원 검수 아름다운 순우리말 100선 융합 교육 자료집
  </footer>

  <!-- ================= 4. 데이터 및 인터랙션 로직 ================= -->
  <script>
    /* 5개 묶음 설정 메타데이터 */
    const VOLUMES = [
      { id: 1, title: "제1집: 맑은 강과 고운 결", rangeText: "제1편 ~ 제10편", start: 1, end: 10, icon: "🌊", desc: "윤슬, 꽃비, 는개, 너럭바위, 오름, 숫눈의 서정" },
      { id: 2, title: "제2집: 푸른 숲과 꿈꾸는 나래", rangeText: "제11편 ~ 제20편", start: 11, end: 20, icon: "🌿", desc: "숨비소리, 갈맷빛, 나래, 소담, 모싯빛의 노래" },
      { id: 3, title: "제3집: 따스한 온기와 밤하늘 별", rangeText: "제21편 ~ 제30편", start: 21, end: 30, icon: "✨", desc: "희나리, 소쿠리, 너그럽다, 볼우물, 별과 새빛의 온기" },
      { id: 4, title: "제4집: 황금 들판과 다정한 마음", rangeText: "제31편 ~ 제40편", start: 31, end: 40, icon: "🌾", desc: "마지기, 대우세, 이슬비, 갸륵하다, 가람의 평화" },
      { id: 5, title: "제5집: 깊은 골짜기와 피어난 꽃등", rangeText: "제41편 ~ 제50편", start: 41, end: 50, icon: "🌸", desc: "골, 이내, 물허벅, 아람, 함초롬하다, 꽃등의 성장" }
    ];

    /* 50편 전체 동시 완결 데이터 */
    const POEMS = [
      // 제1편~10편
      {
        id: 1, vol: 1, title: "윤슬과 은결의 노래",
        words: [
          { word: "윤슬", meaning: "햇빛이나 달빛에 비치어 반짝이는 잔물결" },
          { word: "은결", meaning: "은은하고 곱게 물결치는 결이나 숨결" },
          { word: "가람", meaning: "강의 옛 우리말" }
        ],
        body: `해 질 무렵 조용히 찾아간 가람가
바람이 불어와 물길을 툭 건드리면

금빛 모래알처럼
은빛 별가루처럼
찰랑찰랑 피어나는 눈부신 윤슬

가만히 귀 기울이면 들려와요
맑은 물이 숨 쉬는 보드라운 은결 소리

강물은 저 혼자 반짝이지 않고
햇살을 오롯이 품어 빛을 냅니다.`,
        guide: "늦은 오후 강가나 호숫가에서 반짝이는 물결을 관찰했던 경험을 떠올리며, 자연이 서로 어우러져 빛을 내는 따뜻한 마음을 나누어 봅니다."
      },
      {
        id: 2, vol: 1, title: "봄날의 꽃비 나루터",
        words: [
          { word: "꽃비", meaning: "꽃잎이 비처럼 흩날려 떨어지는 모습" },
          { word: "나루", meaning: "배를 타고 건너다니는 나루터" },
          { word: "살랑살랑", meaning: "바람이 가볍고 부드럽게 부는 모양" }
        ],
        body: `바람이 살랑살랑 불어오던 날
낡은 나룻배 홀로 쉬어 가는 나루에 섰지요

가지 끝마다 매달렸던 연분홍 벚꽃잎들
나비처럼 사뿐히 날아올라

뺨 위로 톡
어깨 위로 톡
소리 없이 내리는 다정한 꽃비

강물을 건너는 배는 떠났어도
봄날의 나루는 꽃잎 배로 가득합니다.`,
        guide: "봄철 바람에 흩날리는 꽃잎을 맞아본 기억을 이야기해 보고, '꽃비'라는 단어가 주는 시각적·촉각적 느낌을 그림으로 표현해 볼 수 있습니다."
      },
      {
        id: 3, vol: 1, title: "아침 숲의 선물, 는개",
        words: [
          { word: "는개", meaning: "안개보다는 굵고 가랑비보다는 가는, 아주 잘게 내리는 눈이나 비" },
          { word: "함초롬하다", meaning: "물기를 머금어 젖은 모양이 차분하고 단정하다." },
          { word: "머금다", meaning: "입이나 꽃망울 속에 물기나 기운을 소중히 품다." }
        ],
        body: `우산도 잊은 채 걸어 들어간 아침 숲
비인지 안개인지 모를 뽀얀 는개가
숲의 머리칼을 가만히 적십니다.

작은 풀잎들은 저마다
맑은 물방울을 또르르 머금고

젖은 옷자락 하나 흐트러짐 없이
얌전하고 함초롬하게
새날의 아침을 맞이합니다.

숲이 건네는 가장 조용한 인사
내 마음도 투명하게 젖어 듭니다.`,
        guide: "이슬비나 안갯비가 내리는 숲의 차분한 분위기를 상상하며, '함초롬하다'라는 표현이 주는 정갈한 느낌을 몸짓이나 낭송 톤으로 살려봅니다."
      },
      {
        id: 4, vol: 1, title: "너럭바위 위의 쉼표",
        words: [
          { word: "너럭바위", meaning: "넓고 평평하게 생긴 큰 바위" },
          { word: "다사롭다", meaning: "따뜻한 기운이 알맞게 있다." },
          { word: "가만히", meaning: "움직이지 않거나 소리 없이 조용하게" }
        ],
        body: `가파른 산길을 오르다 숨이 찰 때면
큰 나무 그늘 아래 누워 있는
널따란 너럭바위를 만납니다.

땀방울 식혀 주는 시원한 바람결에
나뭇잎 사이로 내리쬐는 다사로운 햇살

바위 위에 등을 대고 가만히 누우면
하늘을 떠가는 흰 구름 한 조각이
잠시 쉬어가라며 손을 흔듭니다.

산이 건네준 포근한 의자
우리들의 작은 쉼표 하나`,
        guide: "바쁜 일상이나 공부 중에 잠시 멈추어 자연을 바라보며 얻는 휴식의 소중함을 생각해보는 동시입니다."
      },
      {
        id: 5, vol: 1, title: "오름에 내린 놀빛",
        words: [
          { word: "오름", meaning: "제주도 산기슭에 솟아 있는 작은 화산 언덕" },
          { word: "놀빛", meaning: "해 질 무렵 붉게 물드는 노을의 빛깔" },
          { word: "이내", meaning: "해 질 무렵 멀리 아스라하게 끼는 푸르스름한 안개 기운" }
        ],
        body: `완만한 능선을 따라 걸어 오른 오름 꼭대기
서쪽 하늘이 붉은 붓을 들어
하늘 도화지에 고운 놀빛을 칠합니다.

풀벌레 소리 하나둘 켜질 때
먼 산허리에는 푸르스름한 이내가
비단 옷자락처럼 스르르 감겨옵니다.

하루를 열심히 달린 해도
주황빛, 보랏빛 물감을 풀며
아름다운 작별 인사를 건넵니다.`,
        guide: "저녁노을이 질 때 하늘의 색채 변화를 관찰했던 경험을 바탕으로, '놀빛'과 '이내'가 빚어내는 색감의 대비를 음미해 봅니다."
      },
      {
        id: 6, vol: 1, title: "숫눈 길 위의 첫 발자국",
        words: [
          { word: "숫눈", meaning: "내린 뒤 아직 아무도 밟지 않은 깨끗한 눈" },
          { word: "조잘거리다", meaning: "작은 소리로 끊임없이 재잘재잘 이야기하다." },
          { word: "살며시", meaning: "남이 모르게 조용하고 가만히" }
        ],
        body: `밤새 온 세상에 하얀 솜이불이 내렸어요
운동장 한가운데 펼쳐진
눈부신 순백의 숫눈

참새들은 나뭇가지에 모여앉아
어서 내려가 보라고 조잘거리지만

너무 깨끗해서
너무 고요해서
발을 뗄까 말까 망설이다가

내 작은 운동화 앞코를 살며시 얹어놓습니다.

뽀드득—
세상에서 가장 맑은 소리가
겨울 아침을 깨웁니다.`,
        guide: "아무도 밟지 않은 첫눈을 발견했을 때의 설렘과 망설임, 그리고 첫 발자국을 내디딜 때의 경쾌한 감각을 감상합니다."

수학 문제집을 풀다 말고

선생님과 눈이 마주칠까 봐
슬몃 시선을 돌려 연필을 쥐지만

책상에 턱을 괴고 까무룩 잠이 들 뻔했어요

달아오른 두 뺨을 부드럽게 어루만져 주네요

낮 동안 아이들의 웃음소리가 머물던 운동장
화단가 붉은 장미꽃 주변에는
달콤한 꽃향기가 은은하게 감돌고 있어요

서쪽으로 기우는 주황빛 햇살이

        guide: "차분해진 방과 후 교정을 여유롭게 거닐며 교실과 친구들에 대한 애착과 평화로운 마음을 나눕니다."

동쪽 지평선 너머에서 기지개를 켜며
어둠을 가르고 솟아오르는 눈부신 새빛

꿈을 향해 달리는 우리들의 어린 날은

마당 텃밭에서 갓 딴 나물 반찬들

    /* ================= 애플리케이션 상태 및 화면 라우팅 ================= */
    let currentView = 'home'; // 'home' | 'list' | 'detail'
    let currentVolId = 1;
    let currentPoemId = 1;
    let isLargeFont = false;

    // 네비게이션 함수
    function navigate(view, params = {}) {
      currentView = view;

      document.getElementById('view-home').classList.add('hidden');
      document.getElementById('view-list').classList.add('hidden');
      document.getElementById('view-detail').classList.add('hidden');

      const backBtn = document.getElementById('navBackBtn');

      if (view === 'home') {
        backBtn.classList.add('hidden');
        document.getElementById('view-home').classList.remove('hidden');
      } else if (view === 'list') {
        currentVolId = params.volId || currentVolId;
        backBtn.classList.remove('hidden');
        renderPoemList(currentVolId);
        document.getElementById('view-list').classList.remove('hidden');
      } else if (view === 'detail') {
        currentPoemId = params.poemId || currentPoemId;
        backBtn.classList.remove('hidden');
        renderPoemDetail(currentPoemId);
        document.getElementById('view-detail').classList.remove('hidden');
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 이전 버튼 핸들러
    function goBack() {
      if (currentView === 'detail') {
        navigate('list', { volId: currentVolId });
      } else if (currentView === 'list') {
        navigate('home');
      }
    }

    function goToListFromDetail() {
      navigate('list', { volId: currentVolId });
    }

    /* ================= 1. 홈 화면 묶음 상자 렌더링 ================= */
    function renderHomeVolumes() {
      const container = document.getElementById('volumeCardsContainer');
      container.innerHTML = '';

      VOLUMES.forEach(vol => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-3xl p-6 border-2 border-stone-200 hover:border-emerald-500 hover:shadow-lg transition-all duration-200 cursor-pointer flex flex-col justify-between group relative overflow-hidden";
        card.onclick = () => navigate('list', { volId: vol.id });

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-3">
              <span class="text-3xl p-2 bg-stone-100 group-hover:bg-emerald-100 rounded-2xl transition">${vol.icon}</span>
              <span class="text-xs font-extrabold px-3 py-1 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-200">
                ${vol.rangeText}
              </span>
            </div>
            <h3 class="text-lg font-black text-stone-900 group-hover:text-emerald-800 transition mb-2">
              ${vol.title}
            </h3>
            <p class="text-xs text-stone-500 leading-relaxed mb-4">
              ${vol.desc}
            </p>
          </div>

          <div class="pt-3 border-t border-stone-100 flex items-center justify-between text-xs font-bold text-stone-600 group-hover:text-emerald-700">
            <span>동시 10편 수록</span>
            <span class="flex items-center gap-1 group-hover:translate-x-1 transition-transform">
              시 목록 보기 ➔
            </span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    /* ================= 2. 목록 화면 렌더링 ================= */
    function renderPoemList(volId) {
      const vol = VOLUMES.find(v => v.id === volId);
      if (!vol) return;

      document.getElementById('listVolBadge').textContent = vol.rangeText;
      document.getElementById('listVolTitle').textContent = vol.title;
      document.getElementById('listVolSub').textContent = `${vol.desc}에 수록된 10편의 동시입니다.`;

      const listContainer = document.getElementById('poemListContainer');
      listContainer.innerHTML = '';

      const poemsInVol = POEMS.filter(p => p.vol === volId);

      poemsInVol.forEach(p => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl p-4 sm:p-5 border border-stone-200 hover:border-emerald-400 hover:shadow-md transition-all duration-150 cursor-pointer flex items-center justify-between gap-3 group";
        card.onclick = () => navigate('detail', { poemId: p.id });

        const badgesHtml = p.words.map(w => 
          `<span class="text-[11px] font-bold bg-stone-100 text-stone-700 px-2 py-0.5 rounded-md">${w.word}</span>`
        ).join(' ');

        card.innerHTML = `
          <div class="flex items-center gap-3 sm:gap-4 flex-1">
            <span class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-emerald-50 text-emerald-800 font-black text-xs sm:text-sm flex items-center justify-center shrink-0 border border-emerald-200">
              ${p.id}
            </span>
            <div class="space-y-1">
              <h4 class="text-base sm:text-lg font-extrabold text-stone-900 group-hover:text-emerald-700 transition">
                제${p.id}편. ${p.title}
              </h4>
              <div class="flex flex-wrap gap-1">
                ${badgesHtml}
              </div>
            </div>
          </div>
          <span class="text-stone-400 group-hover:text-emerald-600 text-lg sm:text-xl font-bold pr-2 transition-transform group-hover:translate-x-1">
            ➔
          </span>
        `;
        listContainer.appendChild(card);
      });
    }

    /* ================= 3. 상세 화면 렌더링 ================= */
    function renderPoemDetail(poemId) {
      const poem = POEMS.find(p => p.id === poemId);
      if (!poem) return;

      currentVolId = poem.vol;
      document.getElementById('backToListLabel').textContent = `제${poem.vol}집 목록`;

      document.getElementById('poemDetailNumber').textContent = `제${poem.id}편 / 총 50편`;
      document.getElementById('poemDetailTitle').textContent = poem.title;

      // 융합 단어 배지 렌더링
      const badgesContainer = document.getElementById('poemWordBadges');
      badgesContainer.innerHTML = poem.words.map(w => 
        `<span class="text-xs font-extrabold bg-emerald-100 text-emerald-900 px-2.5 py-1 rounded-full border border-emerald-200">🌿 ${w.word}</span>`
      ).join('');

      // 본문 텍스트
      document.getElementById('poemBodyText').textContent = poem.body;

      // 어휘 풀이 목록
      const vocabList = document.getElementById('poemVocabList');
      vocabList.innerHTML = poem.words.map(w => 
        `<li class="leading-relaxed"><strong class="font-bold text-emerald-950">${w.word}</strong>: ${w.meaning}</li>`
      ).join('');

      // 감상 길라잡이
      document.getElementById('poemGuideText').textContent = poem.guide;

      // 하단 이전 시 / 다음 시 버튼 상태
      document.getElementById('poemPagerText').textContent = `${poem.id} / 50`;

      const prevBtn = document.getElementById('btnPrevPoem');
      if (poem.id > 1) {
        prevBtn.classList.remove('opacity-40', 'pointer-events-none');
      } else {
        prevBtn.classList.add('opacity-40', 'pointer-events-none');
      }

      const nextBtn = document.getElementById('btnNextPoem');
      if (poem.id < 50) {
        nextBtn.classList.remove('opacity-40', 'pointer-events-none');
      } else {
        nextBtn.classList.add('opacity-40', 'pointer-events-none');
      }
    }

    // 이전/다음 시 이동
    function movePoem(step) {
      const nextId = currentPoemId + step;
      if (nextId >= 1 && nextId <= 50) {
        navigate('detail', { poemId: nextId });
      }
    }

    // 글자 크기 조절 토글
    function setTextSize(size) {
      const bodyEl = document.getElementById('poemBodyText');
      const btnNormal = document.getElementById('btnFontNormal');
      const btnLarge = document.getElementById('btnFontLarge');

      if (size === 'large') {
        bodyEl.className = "poem-line text-stone-900 text-xl sm:text-2xl font-semibold max-w-2xl mx-auto space-y-6 text-center sm:text-left whitespace-pre-line";
        btnLarge.className = "text-xs font-bold px-2.5 py-1 rounded-lg bg-emerald-600 text-white transition";
        btnNormal.className = "text-xs font-bold px-2.5 py-1 rounded-lg text-stone-600 hover:bg-stone-100 transition";
      } else {
        bodyEl.className = "poem-line text-stone-800 text-base sm:text-lg font-medium max-w-xl mx-auto space-y-5 text-center sm:text-left whitespace-pre-line";
        btnNormal.className = "text-xs font-bold px-2.5 py-1 rounded-lg bg-emerald-600 text-white transition";
        btnLarge.className = "text-xs font-bold px-2.5 py-1 rounded-lg text-stone-600 hover:bg-stone-100 transition";
      }
    }

    /* 초기 실행 */
    window.addEventListener('DOMContentLoaded', () => {
      renderHomeVolumes();
      navigate('home');
    });
  </script>
</body>
